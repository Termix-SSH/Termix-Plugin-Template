name: Release

# Run by hand from a dev-X.Y.Z branch. stable releases X.Y.Z and merges the
# branch into main; beta publishes X.Y.Z-beta.N for plugins on the beta
# channel. A release can't change once published, so a fix is a new version.

on:
  workflow_dispatch:
    inputs:
      channel:
        description: "Stable release or beta"
        required: true
        default: stable
        type: choice
        options:
          - stable
          - beta
      mode:
        description: "release or dry-run"
        required: true
        default: release
        type: choice
        options:
          - release
          - dry-run

permissions: {}

jobs:
  release:
    permissions:
      contents: write
      # Build provenance, so the community registry can check where the file
      # was built.
      id-token: write
      attestations: write
    uses: Termix-SSH/Termix-Registry/.github/workflows/plugin-release.yml@main
    with:
      channel: ${{ inputs.channel }}
      mode: ${{ inputs.mode }}
    # Both optional: TERMIX_PAT to push workflow file changes to main,
    # TERMIX_PLUGIN_SIGNING_KEY to also sign with your own key.
    secrets:
      TERMIX_PAT: ${{ secrets.TERMIX_PAT }}
      TERMIX_PLUGIN_SIGNING_KEY: ${{ secrets.TERMIX_PLUGIN_SIGNING_KEY }}
